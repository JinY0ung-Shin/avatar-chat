<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Noah 탭 그룹 만들기</title>
    <link rel="stylesheet" href="consent.css" />
  </head>
  <body>
    <main>
      <h1>Noah 탭 그룹을 만들까요?</h1>
      <p class="lead">
        아바타가 새 탭을 열려고 하는데, 이 브라우저에는 아직 <strong>Noah</strong> 탭 그룹이
        없습니다. 허용하면 초록색 <strong>Noah</strong> 그룹이 만들어지고 아래 페이지가 그 안에서
        열립니다.
      </p>

      <section class="target">
        <div id="host" class="host"></div>
        <div id="url" class="url"></div>
      </section>

      <p class="hint">
        아바타는 이 그룹 안의 탭만 보고 조작할 수 있으며, 탭을 그룹 밖으로 끌어내면 즉시
        회수됩니다. 20초 안에 응답하지 않으면 이 요청은 만료됩니다.
      </p>

      <div class="actions">
        <button id="deny" type="button" class="secondary" autofocus>거부</button>
        <button id="allow" type="button">그룹 만들고 열기</button>
      </div>
    </main>
    <script src="consent.js"></script>
  </body>
</html>
