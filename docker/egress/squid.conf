http_port 3128
visible_hostname noah-egress
pid_filename none
shutdown_lifetime 0 seconds
cache deny all
cache_store_log none
cache_log /dev/stderr
# Log destinations, not URL paths/query strings that can contain credentials.
logformat noah %ts.%03tu %>a %rm %>rd %>Hs %Ss
access_log stdio:/dev/stdout noah

acl CONNECT method CONNECT
acl safe_ports port 80 443
# undici uses CONNECT even for plain HTTP; retain domain checks for both ports.
acl tunnel_ports port 80 443
acl blocked dstdomain "/tmp/noah-egress/blocked-domains.txt"
# No IP-literal URLs / CONNECT authorities; they could sidestep domain rules.
acl numeric_host dstdom_regex -n ^[0-9.]+$ ^\[ ^[0-9a-fA-F]*: ^0[xX]
acl local_destination dst 0.0.0.0/8 127.0.0.0/8 169.254.0.0/16 ::/128 ::1/128 fe80::/10
http_access deny manager
http_access deny !safe_ports
http_access deny CONNECT !tunnel_ports
http_access deny numeric_host
http_access deny blocked
http_access deny local_destination
http_access allow all

# Operator-owned optional corporate parent proxy configuration. Never mounted
# into Noah. Access denials above still apply when forwarding to a parent.
include /etc/noah-egress/upstream.conf
