<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>scrolled-hit fixture</title>
    <style>
      body {
        margin: 0;
        font: 14px monospace;
      }
      .band {
        height: 100px;
        box-sizing: border-box;
        border-top: 2px solid #000;
        padding: 4px;
      }
      button {
        margin-left: 200px;
      }
    </style>
  </head>
  <body>
    <!-- 20 bands × 100px: a page tall enough that scrollIntoViewIfNeeded has to
         MOVE the viewport in both directions, with every band's document
         position known by construction (band N starts at N × 100). -->
    <script>
      for (let i = 0; i < 20; i += 1) {
        document.write(
          `<div class="band" id="band${i}">BAND ${i} <button id="btn${i}">button-${i}</button></div>`,
        );
      }
    </script>
    <input type="date" id="dateip" />
    <iframe id="ifr" srcdoc='<button id="inbtn">inner button</button>' width="400" height="80"></iframe>
  </body>
</html>
